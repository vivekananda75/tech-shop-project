<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/signupform.css">
</head>
<body>
    <form action="signup" class="signup">
         <section class="section">
             <br>
             <a href="../html/homepage.html"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-square" viewBox="0 0 16 16">
                <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>

            <p class="head-sign">Signup</p>
            <p class="login">Alredy have an account ? Login</p>
            <input type="username" class="content" placeholder="  Username" ><br>
            <input type="email" class="content" placeholder="  Email"><br>
            <input type="password" class="content"placeholder="  password"><br>
            <input type="password" class="content" placeholder="  Confirm Password">
            <br>
            <button class="signup-button">Signup</button>
            <br>
          
             <h5 class="hrline"><span> Or login with</span></h5>
            <div class="social-button">
             <button class="button-content" style="background-color: rgb(46, 46, 188);">Facebook</button>
             <button class="button-content" style="background-color: rgb(125, 29, 29);">Google</button>
             <button class="button-content" style="background-color: rgb(69, 202, 255);">Twitter</button>
            </div>
            <br>
            <br>
        </section>


























        












    </form>
